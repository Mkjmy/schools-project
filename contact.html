<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ</title>
    <style>
body {
    font-family: sans-serif;
    margin: 0;
    background-color: #f4f4f4;
    color: #333;
}

.container {
    max-width: 800px;
    margin: 20px auto;
    background-color: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

h1 {
    color: #2c3e50;
    border-bottom: 2px solid #3498db;
    padding-bottom: 10px;
    margin-bottom: 30px;
    text-align: center;
}

form h3 {
    color: #2980b9;
    margin-top: 30px;
    margin-bottom: 20px;
}

hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 30px 0;
}

form {
    display: block;
}

p {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="text"],
input[type="email"],
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

.radio-group label,
.checkbox-group label {
    font-weight: normal;
    display: inline-block;
    margin-right: 15px;
}

.submit-button {
    display: block;
    width: 100%;
    padding: 12px;
    background-color: #3498db;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.submit-button:hover {
    background-color: #2980b9;
}

.back-button {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 25px;
    background-color: #6c757d;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}


@media (max-width: 768px) {
    .container {
        padding: 20px;
        margin: 10px;
    }
    h1 {
        font-size: 24px;
    }
}
</style>
</head>
<body>

    <main class="container">
        <h1>Liên Hệ Với Chúng Tôi</h1>
        
        <form action="#" method="POST">
            <h3>Thông tin của bạn</h3>
            <p>
                <label for="name">Họ và Tên</label>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </p>
            
            <hr>

            <h3>Lý do liên hệ</h3>
            <p class="radio-group">
                <input type="radio" id="reason-general" name="reason" value="general" checked>
                <label for="reason-general">Hỏi đáp chung</label>
            </p>
            <p class="radio-group">
                <input type="radio" id="reason-support" name="reason" value="support">
                <label for="reason-support">Hỗ trợ kỹ thuật</label>
            </p>
            <p class="radio-group">
                <input type="radio" id="reason-feedback" name="reason" value="feedback">
                <label for="reason-feedback">Góp ý</label>
            </p>

            <hr>

            <h3>Nội dung</h3>
            <p>
                <label for="message">Tin nhắn của bạn</label>
                <textarea id="message" name="message" required></textarea>
            </p>
            <p class="checkbox-group">
                <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                <label for="newsletter">Tôi muốn nhận bản tin hàng tháng</label>
            </p>
            
            <hr>

            <button type="submit" class="submit-button">Gửi Tin Nhắn</button>
        </form>

        <a href="index.html" class="back-button">
            Quay lại trang chủ
        </a>
    </main>

</body>
</html>
