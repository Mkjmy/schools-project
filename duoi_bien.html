<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh vật dưới biển</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="animal-grid">
        <a href="animals/dolphin.html" class="animal-card">
            <article>
                <img src="pic/dol.png" alt="Cá heo">
                <h3 class="animal-name">Cá heo</h3>
                <p class="animal-desc">Loài vật biển thông minh, luôn mang đến sự tò mò và thích thú cho con người.</p>
                <p class="details-text">Nhấn vào để xem chi tiết</p>
            </article>
        </a>
        <a href="animals/penguin.html" class="animal-card">
            <article>
                <img src="pic/pen.png" alt="Chim cánh cụt">
                <h3 class="animal-name">Chim cánh cụt</h3>
                <p class="animal-desc">Loài chim biển không biết bay, thích nghi hoàn hảo với cuộc sống khắc nghiệt ở vùng cực.</p>
                <p class="details-text">Nhấn vào để xem chi tiết</p>
            </article>
        </a>
    </div>
</body>
</html>
